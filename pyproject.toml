[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langprod"
version = "0.1.0"
description = "Language production analysis pipeline"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5",
    "transformers>=4.40",
    "accelerate>=0.28",
    "h5py>=3.10",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "anthropic>=0.40",
    "openai>=1.12",
    "tqdm>=4.66",
    "pandas>=2.2",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.3",
]
gptq-fallback = [
    "auto-gptq",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
